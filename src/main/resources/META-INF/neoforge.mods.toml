license="${mod_license}"
issueTrackerURL="https://github.com/Acidglow/Centered-Doors/issues"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
displayURL="https://github.com/Acidglow/Centered-Doors"
